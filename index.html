<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>比價小幫手</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<style>
  :root {
    --bg: #f0eee3;
    --panel: #f7f4ea;
    --card: #ffffff;
    --ink: #232921;
    --sub: #706e60;
    --accent: #2f6e52;
    --accent-dark: #204f3c;
    --accent-light: #dceae1;
    --line: #e2ddcd;
    --good: #3f8f5c;
    --bad: #b0483a;
    --gold: #a9791e;
    --gold-light: #f1e4c2;
    --shadow: 0 1px 2px rgba(35,40,30,0.05), 0 4px 14px rgba(35,40,30,0.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 20px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 4px; font-weight: 700; letter-spacing: -0.01em; }
  .sub { color: var(--sub); font-size: 14px; margin-bottom: 20px; }

  .material-icons { font-family: 'Material Icons'; font-weight: normal; font-style: normal; line-height: 1; }
  .item-icon { font-size: 20px; color: var(--accent); vertical-align: -4px; margin-right: 4px; }

  .tab-bar { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
  .tab-btn {
    flex: 1;
    background: none;
    border: none;
    padding: 10px 0;
    font-size: 15px;
    color: var(--sub);
    border-bottom: 2px solid transparent;
    border-radius: 0;
    transition: color 0.15s, border-color 0.15s;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

  .stats-range-row { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }

  .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
  .stat-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .stat-label { font-size: 12px; color: var(--sub); margin-bottom: 4px; }
  .stat-value { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }

  .stats-section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  .stats-section-title { font-size: 14px; font-weight: 600; margin-bottom: 10px; color: var(--ink); }

  .cat-bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 13px; }
  .cat-bar-label { flex: 0 0 70px; color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat-bar-track { flex: 1; height: 8px; background: var(--bg); border-radius: 999px; overflow: hidden; }
  .cat-bar-fill { height: 100%; background: var(--accent); border-radius: 999px; }
  .cat-bar-amount { flex: 0 0 66px; text-align: right; font-weight: 600; }

  .stats-list-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .stats-list-row:last-child { border-bottom: none; }
  .stats-list-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stats-list-count { color: var(--sub); font-size: 13px; white-space: nowrap; }

  .promo-badge {
    font-size: 11px;
    background: var(--gold);
    color: #fff;
    padding: 2px 7px;
    border-radius: 999px;
    margin-left: 4px;
    white-space: nowrap;
    cursor: help;
    font-weight: 500;
  }

  .add-item-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  input, select {
    font-size: 15px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--card);
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus, select:focus { border-color: var(--accent); }
  .add-item-row input { flex: 1; min-width: 160px; }
  .add-item-row select { flex: 0 0 120px; }
  button {
    font-size: 15px;
    padding: 10px 16px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: white;
    cursor: pointer;
    white-space: nowrap;
    font-weight: 500;
    transition: background 0.15s, opacity 0.15s;
  }
  button:hover { background: var(--accent-dark); }
  button.ghost {
    background: transparent;
    color: var(--sub);
    border: 1px solid var(--line);
    font-weight: 400;
  }
  button.ghost:hover { background: var(--panel); }
  button.small { padding: 6px 10px; font-size: 13px; }

  .icon-picker-wrap { position: relative; flex: 0 0 auto; }
  .icon-picker-btn {
    width: 44px;
    height: 44px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .icon-picker-btn .material-icons { font-size: 22px; color: var(--accent); margin: 0; }
  .icon-picker-panel {
    display: none;
    position: absolute;
    top: 50px;
    left: 0;
    z-index: 30;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 8px;
    grid-template-columns: repeat(6, 1fr);
    gap: 4px;
    width: 260px;
    box-shadow: var(--shadow);
  }
  .icon-opt-btn {
    width: 38px;
    height: 38px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    color: var(--ink);
    border: 1px solid transparent;
    border-radius: 8px;
  }
  .icon-opt-btn .material-icons { font-size: 20px; }
  .icon-opt-btn:hover { background: var(--accent-light); }
  .icon-opt-btn.selected { background: var(--accent); color: #fff; border-color: var(--accent); }

  .search-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .backup-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--accent-dark);
    color: #fff;
    padding: 12px 20px;
    border-radius: 999px;
    font-size: 14px;
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 200;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .search-row input { flex: 1; min-width: 160px; }
  .search-row select { flex: 0 0 130px; }

  .filter-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
  .filter-btn {
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--sub);
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .item-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }
  .item-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    cursor: pointer;
    gap: 8px;
  }
  .item-name-wrap { flex: 1; min-width: 0; }
  .item-name { font-size: 17px; font-weight: 600; }
  .category-badge {
    display: inline-block;
    font-size: 11px;
    color: var(--accent);
    background: var(--accent-light);
    padding: 2px 8px;
    border-radius: 999px;
    margin-left: 6px;
    vertical-align: middle;
    font-weight: 500;
  }
  .item-best {
    font-size: 13px;
    color: var(--good);
    margin-top: 4px;
    font-weight: 500;
  }
  .item-best b { font-size: 15px; }
  .best-line { font-size: 13px; color: var(--good); margin-top: 2px; font-weight: 500; }
  .chevron { color: var(--sub); font-size: 13px; margin-top: 6px; transition: transform 0.2s; }
  .item-card.open .chevron { transform: rotate(180deg); }

  .item-edit-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .item-edit-row input[type="text"] { flex: 1; min-width: 120px; }
  .item-edit-row select { flex: 0 0 110px; }

  .item-body {
    display: none;
    margin-top: 14px;
    border-top: 1px solid var(--line);
    padding-top: 14px;
  }
  .item-card.open .item-body { display: block; }

  .entry-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .entry-row input { flex: 1; min-width: 100px; }
  .entry-row input.price { flex: 1.2; min-width: 90px; }
  .channel-select { flex: 0 0 128px !important; min-width: 0 !important; }
  .qty-input { flex: 1; min-width: 80px !important; }
  .unit-input { flex: 1.3; min-width: 100px !important; }
  .unit-hint { font-size: 12px; color: var(--sub); margin: -4px 0 8px 2px; }
  .advanced-toggle {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 13px;
    padding: 4px 0;
    cursor: pointer;
    text-align: left;
    width: 100%;
    margin-bottom: 8px;
    font-weight: 500;
  }
  .advanced-toggle:hover { text-decoration: underline; }
  .advanced-fields { margin-bottom: 4px; }
  .unit-price { font-size: 12px; color: var(--sub); }
  .unit-price.best { color: var(--good); font-weight: 600; }
  .add-entry-btn { flex: 0 0 110px; }

  .channel-tag { font-size: 11px; color: var(--sub); margin-left: 4px; white-space: nowrap; }

  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--sub); font-weight: 500; font-size: 12px; }
  td.price { font-weight: 600; }
  tr.cheapest td.price { color: var(--good); }
  tr.cheapest td.store::after { content: " 🏆"; }
  .del-btn {
    background: none;
    border: none;
    color: var(--sub);
    cursor: pointer;
    font-size: 16px;
    padding: 2px 6px;
    display: inline-flex;
    align-items: center;
    transition: color 0.15s;
  }
  .del-btn:hover { color: var(--bad); }
  .del-btn .material-icons { font-size: 18px; margin: 0; color: inherit; }
  .item-actions .del-btn {
    width: 30px;
    height: 30px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    line-height: 1;
    border-radius: 8px;
  }
  .item-actions .del-btn:hover { background: var(--panel); }
  .mini {
    padding: 4px 8px;
    font-size: 12px;
    border-radius: 8px;
    margin-right: 4px;
    font-weight: 500;
  }
  .mini.del { background: var(--bad); }
  del.orig { color: var(--sub); font-weight: 400; margin-right: 4px; font-size: 12px; }
  .disc-tag {
    font-size: 11px;
    background: var(--good);
    color: #fff;
    padding: 2px 7px;
    border-radius: 999px;
    margin-left: 4px;
    white-space: nowrap;
    font-weight: 500;
  }

  .brand-label { font-size: 11px; color: var(--sub); font-weight: 600; margin-bottom: 2px; }
  .note-label { font-size: 11px; color: var(--sub); font-style: italic; margin-top: 2px; }

  .disc-panel {
    background: var(--panel);
    border: 1px dashed var(--line);
    border-radius: 10px;
    padding: 10px;
    margin: 4px 0 10px;
  }
  .disc-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    padding: 6px 2px;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .disc-item:last-of-type { border-bottom: none; }
  .disc-item.editing { background: var(--accent-light); border-radius: 8px; padding: 6px 8px; }
  .disc-item.disabled { opacity: 0.55; }
  .disc-off-tag {
    font-size: 11px;
    background: var(--sub);
    color: #fff;
    padding: 2px 7px;
    border-radius: 999px;
    margin-left: 4px;
    white-space: nowrap;
  }
  .disc-date { color: var(--sub); font-size: 12px; }
  .disc-actions { display: flex; gap: 4px; }
  .disc-empty { color: var(--sub); font-size: 13px; padding: 4px 2px; }
  .disc-form { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
  .disc-form input { flex: 1; min-width: 110px; }
  .disc-percent { flex: 0 0 92px !important; min-width: 0 !important; }
  .disc-type { flex: 0 0 110px !important; min-width: 0 !important; }
  .disc-bogo-wrap { display: none; align-items: center; gap: 4px; font-size: 13px; color: var(--sub); }
  .disc-qty { flex: 0 0 52px !important; min-width: 0 !important; }

  .empty {
    text-align: center;
    color: var(--sub);
    padding: 40px 0;
    font-size: 14px;
  }
  .item-actions { display: flex; gap: 6px; align-items: flex-start; margin-top: 1px; }

  .chart-screen {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 100;
    flex-direction: column;
  }
  .chart-header {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--card);
  }
  .chart-back {
    width: 36px; height: 36px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    background: transparent; border: 1px solid var(--line); border-radius: 8px; color: var(--ink);
  }
  .chart-title {
    font-size: 16px; font-weight: 600; display: flex; align-items: center;
    flex: 1; min-width: 140px;
  }
  .chart-range-buttons { display: flex; gap: 6px; flex-wrap: wrap; }
  .range-btn {
    padding: 5px 10px; font-size: 12px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card); color: var(--sub);
    transition: background 0.15s, color 0.15s;
  }
  .range-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .chart-scroll {
    flex: 1;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 16px;
  }
  .chart-empty { color: var(--sub); text-align: center; padding-top: 60px; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🛒 比價小幫手</h1>
  <div class="sub">記錄同一樣東西在不同店家的價格，自動幫你標出最便宜的</div>

  <div class="tab-bar">
    <button class="tab-btn active" id="tabHome" onclick="switchScreen('home')">首頁</button>
    <button class="tab-btn" id="tabStore" onclick="switchScreen('store')">店家</button>
    <button class="tab-btn" id="tabStats" onclick="switchScreen('stats')">統計</button>
  </div>

  <div class="backup-row">
    <button class="small ghost" onclick="exportBackup()">⬇️ 匯出備份</button>
    <button class="small ghost" onclick="triggerImport()">⬆️ 匯入備份</button>
    <input type="file" id="importFileInput" accept="application/json" style="display:none;" onchange="handleImportFile(event)">
  </div>

  <div id="homeScreen">
    <div class="add-item-row">
      <input id="newItemInput" type="text" placeholder="新增品項，例如：衛生紙 10包裝">
      <div class="icon-picker-wrap">
        <button type="button" class="icon-picker-btn" onclick="toggleIconPicker('new')">
          <span class="material-icons" id="iconPickerPreview">shopping_cart</span>
        </button>
        <div class="icon-picker-panel" id="iconPickerPanel"></div>
      </div>
      <select id="newItemCategory"></select>
      <button onclick="addItem()">新增</button>
    </div>

    <div class="search-row">
      <input id="searchInput" type="text" placeholder="搜尋品項名稱..." oninput="onSearchInput(this.value)">
      <select id="sortSelect" onchange="onSortChange(this.value)">
        <option value="default">預設排序</option>
        <option value="name">依名稱</option>
        <option value="price">依最低價</option>
        <option value="updated">依最近更新</option>
      </select>
      <button class="small ghost" id="collapseAllBtn" onclick="toggleCollapseAll()">全部收合</button>
    </div>

    <div class="filter-row" id="filterRow"></div>

    <div id="itemList"></div>
    <div id="emptyState" class="empty" style="display:none;"></div>
  </div>

  <div id="storeScreen" style="display:none;">
    <div class="add-item-row">
      <input id="newStoreInput" type="text" placeholder="新增店家名稱，例如：全聯" list="allStores">
      <button onclick="addStore()">新增</button>
    </div>
    <div class="unit-hint">在這裡管理各店家的滿額優惠（例如滿NT$399打9折、滿NT$500折NT$100），會提醒你哪些店現在有活動，但不會自動算進單一商品的比價裡</div>
    <div id="storeList"></div>
    <div id="storeEmptyState" class="empty" style="display:none;"></div>
  </div>

  <div id="statsScreen" style="display:none;">
    <div class="stats-range-row" id="statsRangeButtons"></div>

    <div class="stats-section">
      <div class="stats-section-title">新增花費記錄</div>
      <div class="entry-row">
        <input id="expenseDate" type="date">
        <input id="expenseAmount" type="text" inputmode="numeric" pattern="[0-9]*" oninput="intOnly(this)" placeholder="金額">
      </div>
      <div class="entry-row">
        <input id="expenseNote" type="text" placeholder="備註（例如：這次採買、水電費，可不填）">
      </div>
      <div class="entry-row">
        <button class="small" id="expenseSubmitBtn" onclick="addExpense()">新增</button>
        <button class="small ghost" id="expenseCancelBtn" style="display:none;" onclick="cancelEditExpense()">取消</button>
      </div>
    </div>

    <div id="statsContent"></div>
  </div>

  <datalist id="allStores"></datalist>
</div>

<div class="chart-screen" id="chartScreen">
  <div class="chart-header">
    <button class="chart-back" onclick="closeChart()"><span class="material-icons">arrow_back</span></button>
    <div class="chart-title" id="chartTitle"></div>
    <div class="chart-range-buttons" id="chartRangeButtons"></div>
  </div>
  <div class="chart-scroll" id="chartArea"></div>
</div>

<div id="toast" class="toast"></div>

<script>
const CATEGORIES = ['日用品', '文具', '食品', '飲料', '化妝品', '保健品', '家電', '服飾', '寵物用品', '其他'];

  { name: 'local_gas_station', label: '加油' },

  el.classList.add('show');

function exportBackup() {
  const data = { items, stores, expenses, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `price-tracker-backup-${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function triggerImport() {

}

function handleImportFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data || !Array.isArray(data.items)) {
        alert('檔案格式不正確，無法匯入');
        return;
      }
      if (!confirm('匯入將會覆蓋目前所有資料，確定要繼續嗎？')) return;
      items = data.items || [];
      stores = data.stores || [];
      expenses = data.expenses || [];
      saveData();
      saveStores();
      saveExpenses();
      render();
      renderStores();
      showToast('✅ 匯入完成');
    } catch (err) {
      alert('檔案讀取失敗，請確認是正確的備份檔');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function addEntry(itemId) {
  const it = items.find(i => i.id === itemId);
  if (!it) return;
  const brandInput = document.getElementById('brand-' + itemId);
  const storeInput = document.getElementById('store-' + itemId);
  const channelInput = document.getElementById('channel-' + itemId);
  const priceInput = document.getElementById('price-' + itemId);
  const qtyInput = document.getElementById('qty-' + itemId);
  const unitInput = document.getElementById('unit-' + itemId);
  const noteInput = document.getElementById('note-' + itemId);
  const brand = (brandInput && brandInput.value.trim()) ? brandInput.value.trim() : null;
  const store = storeInput.value.trim();
  const channel = channelInput ? channelInput.value : '實體店面';
  const price = parseInt(priceInput.value, 10);
  if (!store || isNaN(price)) return;

  let quantity = null;
  if (qtyInput) {
    const q = parseInt(qtyInput.value, 10);
    if (!isNaN(q) && q > 0) quantity = q;
  }
  const unit = (unitInput && unitInput.value.trim()) ? unitInput.value.trim() : null;
  const note = (noteInput && noteInput.value.trim()) ? noteInput.value.trim() : null;

  const otherEntries = it.editingEntryId ? it.entries.filter(x => x.id !== it.editingEntryId) : it.entries;
  const priorMin = otherEntries.length ? Math.min(...otherEntries.map(x => x.price)) : null;
  const isNewLow = priorMin !== null && price < priorMin;

  if (it.editingEntryId) {
    const e = it.entries.find(x => x.id === it.editingEntryId);
    if (e) {
      e.brand = brand; e.store = store; e.channel = channel; e.price = price;
      e.quantity = quantity; e.unit = unit; e.note = note;
    }
    it.editingEntryId = null;
  } else {
    it.entries.push({
      id: uid(), brand, store, channel, price, quantity, unit, note, date: todayStr(),
      discounts: [], discountOpen: false, editingDiscountId: null
    });
  }

  if (brandInput) brandInput.value = '';
  storeInput.value = '';
  priceInput.value = '';
  if (qtyInput) qtyInput.value = '';
  if (unitInput) unitInput.value = '';
  if (noteInput) noteInput.value = '';
  saveData();
  render();
  if (isNewLow) showToast(`🎉 這是「${it.name}」記錄過最低的價格！`);

function computeDiscounted(price, percent) {
  return Math.round(price * percent / 100);
}

function discountPrice(basePrice, d) {
  if (d.type === 'member') return d.memberPrice;
  return computeDiscounted(basePrice, d.percent);
}

function discountLabel(d) {
  if (d.type === 'member') return '會員價';
  if (d.type === 'bogo') return `買${d.buyQty}送${d.freeQty}`;
  if (d.percent % 10 === 0) return (d.percent / 10) + '折';
  return d.percent + '%';
}

function activeDiscount(entry) {
  const t = todayStr();
  const active = (entry.discounts || []).filter(d => d.enabled !== false && d.start <= t && (!d.end || d.end >= t));
  if (!active.length) return null;
  active.sort((a, b) => discountPrice(entry.price, a) - discountPrice(entry.price, b));
  return active[0];
}

function effectivePrice(entry) {
  const d = activeDiscount(entry);
  if (d) return discountPrice(entry.price, d);
  return entry.price;
}

  const freeInput = document.getElementById('discFree-' + entryId);

  const startInput = document.getElementById('discStart-' + entryId);
  const endInput = document.getElementById('discEnd-' + entryId);
  const type = typeInput ? typeInput.value : 'percent';

  let percent = null, buyQty = null, freeQty = null, memberPrice = null;
  if (type === 'bogo') {
    buyQty = parseInt(buyInput.value, 10);
    freeQty = parseInt(freeInput.value, 10);
    if (isNaN(buyQty) || buyQty < 1 || isNaN(freeQty) || freeQty < 1) return;
    percent = Math.round((buyQty / (buyQty + freeQty)) * 100);
  } else if (type === 'member') {
    memberPrice = parseInt(memberInput.value, 10);
    if (isNaN(memberPrice) || memberPrice < 0) return;
  } else {
    percent = parseInt(percentInput.value, 10);
    if (isNaN(percent) || percent < 1 || percent > 99) return;
  }
  const start = startInput.value || todayStr();
  const end = endInput.value || null;

  if (!e.discounts) e.discounts = [];
  if (e.editingDiscountId) {
    const d = e.discounts.find(x => x.id === e.editingDiscountId);
    if (d) { d.type = type; d.percent = percent; d.buyQty = buyQty; d.freeQty = freeQty; d.memberPrice = memberPrice; d.start = start; d.end = end; }
    e.editingDiscountId = null;
  } else {
    e.discounts.push({ id: uid(), type, percent, buyQty, freeQty, memberPrice, start, end });

  saveData();
  render();
}

/* ---------- unit price analysis ---------- */

function unitPriceOf(e) {
  if (e.quantity && e.quantity > 0) return effectivePrice(e) / e.quantity;
  return null;
}

function unitKeyOf(e) {
  if (!(e.quantity && e.quantity > 0)) return '';
  return e.unit && e.unit.trim() ? e.unit.trim().toLowerCase() : '__qty__';
}

function analyzeEntries(entries) {
  const groups = {};
  entries.forEach(e => {
    const key = unitKeyOf(e);
    if (!groups[key]) groups[key] = [];
    groups[key].push(e);
  });
  const bestIds = new Set();
  const bestByUnit = {};
  Object.entries(groups).forEach(([key, list]) => {
    if (key === '') {
      const min = Math.min(...list.map(e => effectivePrice(e)));
      list.filter(e => effectivePrice(e) === min).forEach(e => bestIds.add(e.id));
    } else {
      const withUP = list.map(e => ({ e, up: unitPriceOf(e) }));
      const min = Math.min(...withUP.map(x => x.up));
      withUP.filter(x => x.up === min).forEach(x => bestIds.add(x.e.id));
      const label = key === '__qty__' ? '單位' : list.find(e => e.unit && e.unit.trim()).unit.trim();
      bestByUnit[label] = { unitPrice: min, store: withUP.find(x => x.up === min).e.store };
    }
  });
  return { bestIds, bestByUnit };
}

function itemMinPrice(it) {
  if (!it.entries.length) return Infinity;
  return Math.min(...it.entries.map(e => effectivePrice(e)));
}

function itemLatestDate(it) {
  if (!it.entries.length) return '';
  return it.entries.reduce((max, e) => (e.date > max ? e.date : max), '');
}

/* ---------- discount panel html ---------- */

function discountPanelHtml(it, e) {
  const list = (e.discounts || []).slice().sort((a, b) => a.start.localeCompare(b.start));
  const rows = list.map(d => {
    const computed = discountPrice(e.price, d);
    const isEditing = e.editingDiscountId === d.id;
    const isDisabled = d.enabled === false;
    const detail = d.type === 'bogo' ? `（相當於${d.percent}%）` : d.type === 'member' ? '' : `（${d.percent}%）`;
    return `
      <div class="disc-item ${isEditing ? 'editing' : ''} ${isDisabled ? 'disabled' : ''}">
        <span>${discountLabel(d)}${detail} → $${computed}${isDisabled ? ' <span class="disc-off-tag">已關閉</span>' : ''}</span>
        <span class="disc-date">${d.start}${d.end ? ' ~ ' + d.end : ' 起，無期限'}</span>
        <span class="disc-actions">
          <button class="mini" onclick="toggleDiscountEnabled('${it.id}','${e.id}','${d.id}')">${isDisabled ? '開啟' : '關閉'}</button>
          <button class="mini" onclick="editDiscount('${it.id}','${e.id}','${d.id}')">改</button>
          <button class="mini del" onclick="deleteDiscount('${it.id}','${e.id}','${d.id}')">刪</button>
        </span>
      </div>`;
  }).join('');

  return `
    <div class="disc-panel">
      ${rows || '<div class="disc-empty">還沒有折扣記錄</div>'}
      <div class="disc-form">
        <select id="discType-${e.id}" class="disc-type" onchange="toggleDiscTypeUI('${e.id}')">
          <option value="percent">一般折扣</option>
          <option value="bogo">買幾送幾</option>
          <option value="member">會員價</option>
        </select>
        <input id="discPercent-${e.id}" class="disc-percent" type="text" inputmode="numeric" pattern="[0-9]*" oninput="intOnly(this)" placeholder="填90=9折">
        <span id="discBogoWrap-${e.id}" class="disc-bogo-wrap">
          買<input id="discBuy-${e.id}" class="disc-qty" type="text" inputmode="numeric" pattern="[0-9]*" oninput="intOnly(this)" placeholder="1">
          送<input id="discFree-${e.id}" class="disc-qty" type="text" inputmode="numeric" pattern="[0-9]*" oninput="intOnly(this)" placeholder="1">
        </span>
        <input id="discMemberPrice-${e.id}" class="disc-percent" type="text" inputmode="numeric" pattern="[0-9]*" oninput="intOnly(this)" placeholder="會員價NT$" style="display:none;">
        <input id="discStart-${e.id}" type="date" value="${todayStr()}">
        <input id="discEnd-${e.id}" type="date">
        <button class="small" onclick="addOrUpdateDiscount('${it.id}','${e.id}')">${e.editingDiscountId ? '更新' : '新增'}</button>
        ${e.editingDiscountId ? `<button class="small ghost" onclick="cancelEditDiscount('${it.id}','${e.id}')">取消</button>` : ''}
      </div>
    </div>
  `;
}

/* ---------- stores & threshold promos ---------- */

function addStore() {
  const input = document.getElementById('newStoreInput');
  const name = input.value.trim();
  if (!name) return;
  if (stores.some(s => s.name === name)) { input.value = ''; return; }
  stores.push({ id: uid(), name, open: true, promos: [] });
  input.value = '';
  saveStores();
  renderStores();
}

function deleteStore(id) {
  const s = stores.find(x => x.id === id);
  const name = s ? s.name : '這家店';
  if (!confirm(`確定要刪除「${name}」嗎？裡面設定的優惠也會一併刪除，此動作無法復原。`)) return;
  stores = stores.filter(s => s.id !== id);
  saveStores();
  renderStores();
}

function toggleStoreOpen(id) {
  const s = stores.find(x => x.id === id);
  if (s) s.open = !s.open;
  renderStores();
}

function togglePromoTypeUI(storeId) {
  const typeSel = document.getElementById('promoType-' + storeId);
  const valueInput = document.getElementById('promoValue-' + storeId);
  if (!typeSel || !valueInput) return;
  valueInput.placeholder = typeSel.value === 'percent' ? '打幾%，如90=9折' : '折抵NT$多少';
}

function addOrUpdatePromo(storeId) {
  const s = stores.find(x => x.id === storeId);
  if (!s) return;
  const typeInput = document.getElementById('promoType-' + storeId);
  const thresholdInput = document.getElementById('promoThreshold-' + storeId);
  const valueInput = document.getElementById('promoValue-' + storeId);
  const startInput = document.getElementById('promoStart-' + storeId);
  const endInput = document.getElementById('promoEnd-' + storeId);
  const type = typeInput.value;
  const threshold = parseInt(thresholdInput.value, 10);
  const value = parseInt(valueInput.value, 10);
  if (isNaN(threshold) || threshold <= 0 || isNaN(value) || value <= 0) return;
  if (type === 'percent' && (value < 1 || value > 99)) return;
  const start = startInput.value || todayStr();
  const end = endInput.value || null;

  if (!s.promos) s.promos = [];
  if (s.editingPromoId) {
    const p = s.promos.find(x => x.id === s.editingPromoId);
    if (p) { p.type = type; p.threshold = threshold; p.value = value; p.start = start; p.end = end; }
    s.editingPromoId = null;
  } else {
    s.promos.push({ id: uid(), type, threshold, value, start, end });
  }
  saveStores();
  renderStores();
}

function editPromo(storeId, promoId) {
  const s = stores.find(x => x.id === storeId);
  if (!s) return;
  s.editingPromoId = promoId;
  s.open = true;
  renderStores();
  const p = s.promos.find(x => x.id === promoId);
  if (p) {
    const typeEl = document.getElementById('promoType-' + storeId);
    const thEl = document.getElementById('promoThreshold-' + storeId);
    const valEl = document.getElementById('promoValue-' + storeId);
    const sEl = document.getElementById('promoStart-' + storeId);
    const eEl = document.getElementById('promoEnd-' + storeId);
    if (typeEl) typeEl.value = p.type;
    if (thEl) thEl.value = p.threshold;
    if (valEl) valEl.value = p.value;
    if (sEl) sEl.value = p.start;
    if (eEl) eEl.value = p.end || '';
    togglePromoTypeUI(storeId);
  }
}

function cancelEditPromo(storeId) {
  const s = stores.find(x => x.id === storeId);
  if (!s) return;
  s.editingPromoId = null;
  renderStores();
}

function deletePromo(storeId, promoId) {
  const s = stores.find(x => x.id === storeId);
  if (!s) return;
  if (!confirm('確定要刪除這筆優惠嗎？')) return;
  s.promos = (s.promos || []).filter(p => p.id !== promoId);
  if (s.editingPromoId === promoId) s.editingPromoId = null;
  saveStores();
  renderStores();
}

function togglePromoEnabled(storeId, promoId) {
  const s = stores.find(x => x.id === storeId);
  const p = s && (s.promos || []).find(x => x.id === promoId);
  if (!p) return;
  p.enabled = p.enabled === false ? true : false;
  saveStores();
  renderStores();
}

function promoLabel(p) {
  if (p.type === 'percent') {
    const foldLabel = p.value % 10 === 0 ? (p.value / 10) + '折' : p.value + '%';
    return `滿NT$${p.threshold} 打${foldLabel}`;
  }
  return `滿NT$${p.threshold} 折NT$${p.value}`;
}

function activeStorePromos(store) {
  const t = todayStr();
  return (store.promos || []).filter(p => p.enabled !== false && p.start <= t && (!p.end || p.end >= t));
}

function storeActivePromo(storeName) {
  const s = stores.find(x => x.name === storeName);
  if (!s) return null;
  const active = activeStorePromos(s);
  return active.length ? active[0] : null;
}

function renderStores() {
  const list = document.getElementById('storeList');
  const empty = document.getElementById('storeEmptyState');
  if (!list || !empty) return;

  if (stores.length === 0) {
    list.innerHTML = '';
    empty.style.display = 'block';
    empty.textContent = '還沒有任何店家，先新增一個吧！';
    return;
  }
  empty.style.display = 'none';

  list.innerHTML = stores.map(s => {
    const promos = (s.promos || []).slice().sort((a, b) => a.start.localeCompare(b.start));
    const t = todayStr();
    const promoRows = promos.map(p => {
      const isEditing = s.editingPromoId === p.id;
      const isDisabled = p.enabled === false;
      const isActive = !isDisabled && p.start <= t && (!p.end || p.end >= t);
      return `
        <div class="disc-item ${isEditing ? 'editing' : ''} ${isDisabled ? 'disabled' : ''}">
          <span>${escapeHtml(promoLabel(p))}${isActive ? ' <span class="promo-badge">生效中</span>' : ''}${isDisabled ? ' <span class="disc-off-tag">已關閉</span>' : ''}</span>
          <span class="disc-date">${p.start}${p.end ? ' ~ ' + p.end : ' 起，無期限'}</span>
          <span class="disc-actions">
            <button class="mini" onclick="togglePromoEnabled('${s.id}','${p.id}')">${isDisabled ? '開啟' : '關閉'}</button>
            <button class="mini" onclick="editPromo('${s.id}','${p.id}')">改</button>
            <button class="mini del" onclick="deletePromo('${s.id}','${p.id}')">刪</button>
          </span>
        </div>`;
    }).join('');

    return `
      <div class="item-card ${s.open ? 'open' : ''}">
        <div class="item-head" onclick="toggleStoreOpen('${s.id}')">
          <div class="item-name-wrap">
            <div class="item-name"><span class="material-icons item-icon">store</span>${escapeHtml(s.name)}</div>
            <div class="item-best" style="color:var(--sub);">${promos.length ? `共 ${promos.length} 筆優惠` : '還沒有設定優惠'}</div>
          </div>
          <div class="item-actions">
            <button class="del-btn" onclick="event.stopPropagation(); deleteStore('${s.id}')" title="刪除店家">🗑</button>
            <span class="chevron">▾</span>
          </div>
        </div>
        <div class="item-body">
          <div class="disc-panel">
            ${promoRows || '<div class="disc-empty">還沒有優惠記錄</div>'}
            <div class="disc-form">
              <select id="promoType-${s.id}" class="disc-type" onchange="togglePromoTypeUI('${s.id}')">
                <option value="percent">滿額打折</option>
                <option value="amount">滿額折抵</option>
              </select>
              <input id="promoThreshold-${s.id}" class="disc-percent" type="text" inputmode="numeric" pattern="[0-9]*" oninput="intOnly(this)" placeholder="滿NT$多少">
              <input id="promoValue-${s.id}" class="disc-percent" type="text" inputmode="numeric" pattern="[0-9]*" oninput="intOnly(this)" placeholder="打幾%，如90=9折">
              <input id="promoStart-${s.id}" type="date" value="${todayStr()}">
              <input id="promoEnd-${s.id}" type="date">
              <button class="small" onclick="addOrUpdatePromo('${s.id}')">${s.editingPromoId ? '更新' : '新增'}</button>
              ${s.editingPromoId ? `<button class="small ghost" onclick="cancelEditPromo('${s.id}')">取消</button>` : ''}
            </div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

/* ---------- spending stats dashboard ---------- */

function discountAtDate(entry, dateStr) {
  const list = (entry.discounts || []).filter(d => d.enabled !== false && d.start <= dateStr && (!d.end || d.end >= dateStr));
  if (!list.length) return null;
  list.sort((a, b) => discountPrice(entry.price, a) - discountPrice(entry.price, b));
  return list[0];
}

function priceAtDate(entry) {
  const d = discountAtDate(entry, entry.date);
  return d ? discountPrice(entry.price, d) : entry.price;
}

function renderStatsRangeButtons() {
  const wrap = document.getElementById('statsRangeButtons');
  if (!wrap) return;
  const ranges = [
    { key: 'month', label: '本月' },
    { key: '3m', label: '近3個月' },
    { key: 'all', label: '全部' }
  ];
  wrap.innerHTML = ranges.map(r => `<button class="range-btn ${currentStatsRange === r.key ? 'active' : ''}" onclick="setStatsRange('${r.key}')">${r.label}</button>`).join('');
}

function setStatsRange(key) {
  currentStatsRange = key;
  renderStatsRangeButtons();
  renderStats();
}

function addExpense() {
  const dateInput = document.getElementById('expenseDate');
  const amountInput = document.getElementById('expenseAmount');
  const noteInput = document.getElementById('expenseNote');
  const date = dateInput.value || todayStr();
  const amount = parseInt(amountInput.value, 10);
  if (isNaN(amount) || amount <= 0) return;
  const note = (noteInput && noteInput.value.trim()) ? noteInput.value.trim() : null;

  if (editingExpenseId) {
    const ex = expenses.find(x => x.id === editingExpenseId);
    if (ex) { ex.date = date; ex.amount = amount; ex.note = note; }
    editingExpenseId = null;
  } else {
    expenses.push({ id: uid(), date, amount, note });
  }

  amountInput.value = '';
  if (noteInput) noteInput.value = '';
  dateInput.value = todayStr();
  const submitBtn = document.getElementById('expenseSubmitBtn');
  if (submitBtn) submitBtn.textContent = '新增';
  const cancelBtn = document.getElementById('expenseCancelBtn');
  if (cancelBtn) cancelBtn.style.display = 'none';

  saveExpenses();
  renderStats();
}

function editExpense(id) {
  const ex = expenses.find(x => x.id === id);
  if (!ex) return;
  editingExpenseId = id;
  const dateInput = document.getElementById('expenseDate');
  const amountInput = document.getElementById('expenseAmount');
  const noteInput = document.getElementById('expenseNote');
  if (dateInput) dateInput.value = ex.date;
  if (amountInput) amountInput.value = ex.amount;
  if (noteInput) noteInput.value = ex.note || '';
  const submitBtn = document.getElementById('expenseSubmitBtn');
  if (submitBtn) submitBtn.textContent = '更新';
  const cancelBtn = document.getElementById('expenseCancelBtn');
  if (cancelBtn) cancelBtn.style.display = '';
}

function cancelEditExpense() {
  editingExpenseId = null;
  const dateInput = document.getElementById('expenseDate');
  const amountInput = document.getElementById('expenseAmount');
  const noteInput = document.getElementById('expenseNote');
  if (amountInput) amountInput.value = '';
  if (noteInput) noteInput.value = '';
  if (dateInput) dateInput.value = todayStr();
  const submitBtn = document.getElementById('expenseSubmitBtn');
  if (submitBtn) submitBtn.textContent = '新增';
  const cancelBtn = document.getElementById('expenseCancelBtn');
  if (cancelBtn) cancelBtn.style.display = 'none';
}

function deleteExpense(id) {
  if (!confirm('確定要刪除這筆花費記錄嗎？')) return;
  expenses = expenses.filter(x => x.id !== id);
  if (editingExpenseId === id) cancelEditExpense();
  saveExpenses();
  renderStats();
}

function renderStats() {
  const content = document.getElementById('statsContent');
  if (!content) return;

  const now = new Date();
  let cutoff = null;
  if (currentStatsRange === 'month') {
    cutoff = new Date(now.getFullYear(), now.getMonth(), 1);
  } else if (currentStatsRange === '3m') {
    cutoff = new Date(now.getTime() - 90 * 86400000);
  }

  const filteredExpenses = expenses.filter(ex => !cutoff || new Date(ex.date) >= cutoff);
  const totalSpend = filteredExpenses.reduce((sum, ex) => sum + ex.amount, 0);

  const allEntries = [];
  items.forEach(it => {
    (it.entries || []).forEach(e => {
      if (!cutoff || new Date(e.date) >= cutoff) {
        allEntries.push({ item: it, entry: e });
      }
    });
  });

  if (allEntries.length === 0 && filteredExpenses.length === 0) {
    content.innerHTML = '<div class="empty">這個範圍內還沒有任何記錄</div>';
    return;
  }

  let totalSaved = 0;
  allEntries.forEach(({ entry }) => {
    const paid = priceAtDate(entry);
    if (paid < entry.price) totalSaved += (entry.price - paid);
  });

  const recordCount = allEntries.length;
  const itemCount = items.length;

  const itemCounts = {};
  allEntries.forEach(({ item }) => {
    itemCounts[item.id] = (itemCounts[item.id] || 0) + 1;
  });
  const topItems = Object.entries(itemCounts)
    .map(([id, count]) => ({ item: items.find(i => i.id === id), count }))
    .filter(x => x.item)
    .sort((a, b) => b.count - a.count)
    .slice(0, 5);

  const catAmount = {};
  allEntries.forEach(({ item, entry }) => {
    const cat = item.category || '其他';
    catAmount[cat] = (catAmount[cat] || 0) + priceAtDate(entry);
  });
  const catList = Object.entries(catAmount).sort((a, b) => b[1] - a[1]);
  const maxCat = Math.max(...catList.map(c => c[1]), 1);

  const storeAmount = {};
  allEntries.forEach(({ entry }) => {
    storeAmount[entry.store] = (storeAmount[entry.store] || 0) + priceAtDate(entry);
  });
  const topStores = Object.entries(storeAmount).sort((a, b) => b[1] - a[1]).slice(0, 5);

  const expenseRows = filteredExpenses.slice().sort((a, b) => b.date.localeCompare(a.date)).map(ex => `
    <div class="stats-list-row">
      <span class="stats-list-name">${ex.date}${ex.note ? ' · ' + escapeHtml(ex.note) : ''}</span>
      <span class="stats-list-count">NT$${ex.amount}</span>
      <span class="disc-actions">
        <button class="mini" onclick="editExpense('${ex.id}')">改</button>
        <button class="mini del" onclick="deleteExpense('${ex.id}')">刪</button>
      </span>
    </div>
  `).join('');

  content.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">總花費（自己記的）</div>
        <div class="stat-value">NT$${totalSpend}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">比價折扣省下</div>
        <div class="stat-value" style="color:var(--good);">NT$${totalSaved}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">比價記錄筆數</div>
        <div class="stat-value">${recordCount}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">追蹤品項數</div>
        <div class="stat-value">${itemCount}</div>
      </div>
    </div>

    <div class="stats-section">
      <div class="stats-section-title">花費記錄</div>
      ${expenseRows || '<div class="disc-empty">這個範圍內還沒有花費記錄</div>'}
    </div>

    ${allEntries.length ? `
    <div class="stats-section">
      <div class="stats-section-title">依分類比價金額</div>
      <div class="unit-hint" style="margin-top:-4px;">以下依照比價記錄推算，不是實際花費</div>
      ${catList.map(([cat, amt]) => `
        <div class="cat-bar-row">
          <div class="cat-bar-label">${escapeHtml(cat)}</div>
          <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${Math.round((amt / maxCat) * 100)}%"></div></div>
          <div class="cat-bar-amount">NT$${amt}</div>
        </div>
      `).join('')}
    </div>

    <div class="stats-section">
      <div class="stats-section-title">最常記錄的品項</div>
      ${topItems.map(({ item, count }) => `
        <div class="stats-list-row">
          <span class="material-icons item-icon">${escapeHtml(item.icon || 'category')}</span>
          <span class="stats-list-name">${escapeHtml(item.name)}</span>
          <span class="stats-list-count">${count} 筆</span>
        </div>
      `).join('')}
    </div>

    <div class="stats-section">
      <div class="stats-section-title">常光顧的店家</div>
      ${topStores.map(([store, amt]) => `
        <div class="stats-list-row">
          <span class="stats-list-name">${escapeHtml(store)}</span>
          <span class="stats-list-count">NT$${amt}</span>
        </div>
      `).join('')}
    </div>
    ` : ''}
  `;
}

function renderChartRangeButtons() {

  const ranges = [
    { key: '7d', label: '一週' },
    { key: '14d', label: '兩週' },

  renderChart();
}

function buildChartSVG(points, widthPx, heightPx) {
  const padL = 56, padR = 20, padT = 20, padB = 40;
  const maxPrice = Math.max(...points.map(p => p.price), 0);
  const niceMax = maxPrice <= 0 ? 10 : Math.ceil((maxPrice * 1.15) / 10) * 10;
  const innerW = widthPx - padL - padR;
  const innerH = heightPx - padT - padB;
  const n = points.length;
  const stepX = n > 1 ? innerW / (n - 1) : 0;

  function xAt(i) { return n > 1 ? padL + i * stepX : padL + innerW / 2; }
  function yAt(price) { return padT + innerH - (price / niceMax) * innerH; }

  const ticks = 4;
  let gridLines = '';
  let yLabels = '';
  for (let t = 0; t <= ticks; t++) {
    const val = Math.round((niceMax * t) / ticks);
    const y = yAt(val);
    gridLines += `<line x1="${padL}" y1="${y}" x2="${widthPx - padR}" y2="${y}" stroke="#e2ddcd" stroke-width="1" />`;
    yLabels += `<text x="${padL - 8}" y="${y + 4}" font-size="11" fill="#706e60" text-anchor="end">NT$${val}</text>`;
  }

  const axisX = `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${heightPx - padB}" stroke="#2f6e52" stroke-width="1.5" />`;
  const axisY = `<line x1="${padL}" y1="${heightPx - padB}" x2="${widthPx - padR}" y2="${heightPx - padB}" stroke="#2f6e52" stroke-width="1.5" />`;

  const linePoints = points.map((p, i) => `${xAt(i)},${yAt(p.price)}`).join(' ');

  let dots = '';
  let xLabels = '';
  points.forEach((p, i) => {
    const x = xAt(i);
    const y = yAt(p.price);
    const safeStore = String(p.store).replace(/&/g, '&amp;').replace(/</g, '&lt;');
    dots += `<circle cx="${x}" cy="${y}" r="4" fill="#2f6e52"><title>${p.date} ${safeStore}\nNT$${p.price}</title></circle>`;
    xLabels += `<text x="${x}" y="${heightPx - padB + 18}" font-size="10" fill="#706e60" text-anchor="middle">${p.dateLabel}</text>`;
  });

  return `<svg width="${widthPx}" height="${heightPx}" xmlns="http://www.w3.org/2000/svg">
    ${gridLines}
    ${axisX}${axisY}
    <polyline points="${linePoints}" fill="none" stroke="#2f6e52" stroke-width="2" />
    ${dots}
    ${yLabels}
    ${xLabels}
  </svg>`;
}

function renderChart() {
  const it = items.find(i => i.id === currentChartItemId);
  const titleEl = document.getElementById('chartTitle');
  const area = document.getElementById('chartArea');
  if (!it) { area.innerHTML = ''; return; }
  titleEl.innerHTML = `<span class="material-icons item-icon">${escapeHtml(it.icon || 'category')}</span>${escapeHtml(it.name)}`;

  const now = new Date();
  let cutoff = null;
  if (currentChartRange === '7d') cutoff = new Date(now.getTime() - 7 * 86400000);
  else if (currentChartRange === '14d') cutoff = new Date(now.getTime() - 14 * 86400000);
  else if (currentChartRange === '1m') cutoff = new Date(now.getTime() - 30 * 86400000);
  else if (currentChartRange === '6m') cutoff = new Date(now.getTime() - 182 * 86400000);

  let points = (it.entries || [])
    .filter(e => !cutoff || new Date(e.date) >= cutoff)
    .map(e => ({ date: e.date, price: e.price, store: e.store }))
    .sort((a, b) => a.date.localeCompare(b.date));

  if (points.length === 0) {
    area.innerHTML = '<div class="chart-empty">這個時間範圍內還沒有價格記錄</div>';
    return;
  }

  points = points.map(p => ({ ...p, dateLabel: p.date.slice(5) }));

  const visibleW = Math.max(area.clientWidth || (window.innerWidth - 32), 300);
  const visibleH = Math.max(area.clientHeight || (window.innerHeight - 170), 260);
  const spacing = 64;
  const padTotal = 90;
  const neededW = padTotal + Math.max(points.length - 1, 0) * spacing;
  const svgW = Math.max(visibleW, neededW);

  area.innerHTML = buildChartSVG(points, svgW, visibleH);
}

/* ---------- main render ---------- */

function render() {
  const list = document.getElementById('itemList');
  const empty = document.getElementById('emptyState');
  if (!loaded) return;

  renderFilterRow();

  const collapseBtn = document.getElementById('collapseAllBtn');
  if (collapseBtn) {
    const anyOpen = items.some(it => it.open);
    collapseBtn.textContent = anyOpen ? '全部收合' : '全部展開';
  }

  const allStores = [...new Set(items.flatMap(it => it.entries.map(e => e.store)))];
  const datalist = document.getElementById('allStores');
  if (datalist) {
    datalist.innerHTML = allStores.map(s => `<option value="${escapeHtml(s)}">`).join('');
  }

  let itemsToShow = currentFilter === 'all'
    ? items
    : items.filter(it => (it.category || '其他') === currentFilter);

  if (searchQuery.trim()) {
    const q = searchQuery.trim().toLowerCase();
    itemsToShow = itemsToShow.filter(it => it.name.toLowerCase().includes(q));
  }

  if (sortMode === 'name') {
    itemsToShow = [...itemsToShow].sort((a, b) => a.name.localeCompare(b.name, 'zh-Hant'));
  } else if (sortMode === 'price') {
    itemsToShow = [...itemsToShow].sort((a, b) => itemMinPrice(a) - itemMinPrice(b));
  } else if (sortMode === 'updated') {
    itemsToShow = [...itemsToShow].sort((a, b) => itemLatestDate(b).localeCompare(itemLatestDate(a)));
  }

  if (items.length === 0) {
    list.innerHTML = '';
    empty.style.display = 'block';
    empty.textContent = '還沒有任何品項，先新增一個吧！';
    return;
  }
  if (itemsToShow.length === 0) {
    list.innerHTML = '';
    empty.style.display = 'block';
    empty.textContent = '找不到符合的品項';
    return;
  }
  empty.style.display = 'none';

  list.innerHTML = itemsToShow.map(it => {
    const sorted = [...it.entries].sort((a, b) => effectivePrice(a) - effectivePrice(b));
    const minPrice = sorted.length ? effectivePrice(sorted[0]) : null;
    const bestStore = sorted.length ? sorted[0].store : null;
    const { bestIds, bestByUnit } = analyzeEntries(it.entries);

    const rows = [...it.entries]
      .sort((a, b) => effectivePrice(a) - effectivePrice(b))
      .map(e => {
        const ad = activeDiscount(e);
        const priceCell = ad
          ? `<del class="orig">$${e.price}</del>$${discountPrice(e.price, ad)} <span class="disc-tag">${discountLabel(ad)}</span>`
          : `$${e.price}`;
        const up = unitPriceOf(e);
        const isBest = bestIds.has(e.id);
        const upCell = up !== null
          ? `<span class="unit-price ${isBest ? 'best' : ''}">$${up.toFixed(2)}/${escapeHtml(e.unit ? e.unit.trim() : '單位')}</span>`
          : '<span class="unit-price">-</span>';
        const discCount = (e.discounts || []).length;
        const storePromo = storeActivePromo(e.store);
        const promoBadge = storePromo ? `<span class="promo-badge" title="${escapeHtml(promoLabel(storePromo))}">🏷️優惠</span>` : '';

        let rowHtml = `
        <tr class="${isBest ? 'cheapest' : ''}">
          <td class="store">
            ${e.brand ? `<div class="brand-label">${escapeHtml(e.brand)}</div>` : ''}
            ${escapeHtml(e.store)}<span class="channel-tag">${e.channel === '線上通路' ? '🌐線上' : '🏬門市'}</span>${promoBadge}
            ${e.note ? `<div class="note-label">📝 ${escapeHtml(e.note)}</div>` : ''}
          </td>
          <td class="price">${priceCell}</td>
          <td>${upCell}</td>
          <td>${e.date}</td>
          <td>
            <button class="mini" onclick="event.stopPropagation(); startEditEntry('${it.id}','${e.id}')">改</button>
            <button class="mini" onclick="event.stopPropagation(); toggleDiscountPanel('${it.id}','${e.id}')">折扣${discCount ? '(' + discCount + ')' : ''}</button>
            <button class="del-btn" onclick="event.stopPropagation(); deleteEntry('${it.id}','${e.id}')">✕</button>
          </td>
        </tr>`;
        if (e.discountOpen) {
          rowHtml += `<tr><td colspan="5">${discountPanelHtml(it, e)}</td></tr>`;
        }
        return rowHtml;
      }).join('');

    const unitBestLines = Object.entries(bestByUnit)
      .map(([label, info]) => `<div class="best-line">換算後最划算（每${escapeHtml(label)}）：<b>$${info.unitPrice.toFixed(2)}</b>（${escapeHtml(info.store)}）</div>`)
      .join('');

    const nameArea = it.editingItem ? `
        <div class="item-edit-row" onclick="event.stopPropagation()">
          <div class="icon-picker-wrap">
            <button type="button" class="icon-picker-btn" onclick="toggleIconPicker('${it.id}')">
              <span class="material-icons" id="editIconPreview-${it.id}">${escapeHtml(it.icon || 'category')}</span>
            </button>
            <div class="icon-picker-panel" id="iconPickerPanel-${it.id}"></div>
          </div>
          <input id="editName-${it.id}" type="text" value="${escapeHtml(it.name)}">
          <select id="editCategory-${it.id}">${CATEGORIES.map(c => `<option value="${c}" ${c === it.category ? 'selected' : ''}>${c}</option>`).join('')}</select>
          <button class="small" onclick="saveItemEdit('${it.id}')">儲存</button>
          <button class="small ghost" onclick="cancelItemEdit('${it.id}')">取消</button>
        </div>
      ` : `
        <div class="item-name"><span class="material-icons item-icon">${escapeHtml(it.icon || 'category')}</span>${escapeHtml(it.name)}<span class="category-badge">${escapeHtml(it.category || '其他')}</span></div>
        ${minPrice !== null
          ? `<div class="item-best">目前最低價：<b>$${minPrice}</b>（${escapeHtml(bestStore)}）</div>`
          : `<div class="item-best" style="color:var(--sub);">還沒有價格記錄</div>`}
        ${unitBestLines}
      `;

    return `
      <div class="item-card ${it.open ? 'open' : ''}">
        <div class="item-head" onclick="toggleOpen('${it.id}')">
          <div class="item-name-wrap">${nameArea}</div>
          <div class="item-actions">
            <button class="del-btn" onclick="event.stopPropagation(); startItemEdit('${it.id}')" title="編輯品項"><span class="material-icons">edit</span></button>
            <button class="del-btn" onclick="event.stopPropagation(); openChart('${it.id}')" title="價格走勢"><span class="material-icons">show_chart</span></button>
            <button class="del-btn" onclick="event.stopPropagation(); deleteItem('${it.id}')" title="刪除品項">🗑</button>
            <span class="chevron">▾</span>
          </div>
        </div>
        <div class="item-body">
          <div class="entry-row">
            <input id="store-${it.id}" type="text" placeholder="店家名稱（打過的會自動提示）" list="allStores">
            <select id="channel-${it.id}" class="channel-select">
              <option value="實體店面">🏬 實體店面</option>
              <option value="線上通路">🌐 線上通路</option>
            </select>
          </div>
          <div class="entry-row">
            <input id="price-${it.id}" class="price" type="text" inputmode="numeric" pattern="[0-9]*" oninput="intOnly(this)" placeholder="價格">
            <button class="small add-entry-btn" onclick="addEntry('${it.id}')">${it.editingEntryId ? '更新' : '加入'}</button>
            ${it.editingEntryId ? `<button class="small ghost" onclick="cancelEditEntry('${it.id}')">取消編輯</button>` : ''}
          </div>
          <button type="button" class="advanced-toggle" onclick="toggleAdvanced('${it.id}')">${it.advancedOpen ? '▴ 收合進階選項' : '▾ 進階選項（牌子・數量單位・備註）'}</button>
          ${it.advancedOpen ? `
            <div class="advanced-fields">
              <div class="entry-row">
                <input id="brand-${it.id}" type="text" placeholder="牌子名稱（例如：舒潔、五月花）">
              </div>
              <div class="entry-row">
                <input id="qty-${it.id}" class="qty-input" type="text" inputmode="numeric" pattern="[0-9]*" oninput="intOnly(this)" placeholder="數量">
                <input id="unit-${it.id}" class="unit-input" type="text" placeholder="單位，如 抽/ml/g">
              </div>
              <div class="entry-row">
                <input id="note-${it.id}" type="text" placeholder="備註（例如：口味、規格、心得）">
              </div>
              <div class="unit-hint">數量+單位可不填；填了才能自動換算「每抽/每100ml多少錢」</div>
            </div>
          ` : ''}
          ${it.entries.length ? `
            <table>
              <thead><tr><th>店家</th><th>價格</th><th>換算單價</th><th>日期</th><th>操作</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          ` : ''}
        </div>
      </div>
    `;
  }).join('');
}

document.getElementById('newItemInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') addItem();
});
document.getElementById('newStoreInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') addStore();
});

loadData();
</script>
</body>
