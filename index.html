<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手作定價帳本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDEAE0;
    --card:#FFFFFF;
    --line:#D8D2C2;
    --ink:#2B2A25;
    --ink-soft:#6B6656;
    --moss:#4B6B53;
    --moss-soft:#E4EBE3;
    --rust:#8C3F2A;
    --rust-soft:#F3E4DE;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC',sans-serif;
    line-height:1.6;
  }
  h1,h2,h3{
    font-family:'Noto Serif TC',serif;
    font-weight:700;
    margin:0;
  }
  .wrap{max-width:720px;margin:0 auto;padding:28px 18px 80px;}
  header.top{margin-bottom:22px;}
  header.top h1{font-size:26px;letter-spacing:.5px;}
  header.top p{color:var(--ink-soft);font-size:14px;margin-top:6px;}

  nav.tabs{display:flex;border-bottom:2px solid var(--ink);margin-bottom:22px;}
  nav.tabs button{
    flex:1;background:none;border:none;padding:12px 8px;
    font-family:'Noto Serif TC',serif;font-size:16px;font-weight:700;
    color:var(--ink-soft);cursor:pointer;position:relative;top:2px;
  }
  nav.tabs button.active{color:var(--ink);border-bottom:2px solid var(--ink);}

  section{display:none;}
  section.active{display:block;}

  .row-item{
    background:var(--card);
    border:1px solid var(--line);
    border-left:4px solid var(--moss);
    padding:14px 16px;
    margin-bottom:10px;
    border-radius:4px;
  }
  .row-item.rust{border-left-color:var(--rust);}
  .row-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;cursor:pointer;}
  .row-head .title{font-weight:700;font-size:16px;}
  .row-head .sub{font-size:13px;color:var(--ink-soft);margin-top:2px;}
  .row-nums{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .row-nums .price{font-size:17px;font-weight:700;}
  .row-nums .margin{font-size:12px;color:var(--ink-soft);}
  .margin.good{color:var(--moss);}
  .margin.bad{color:var(--rust);}

  .details{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;display:none;}
  .details.open{display:block;}
  .details table{width:100%;border-collapse:collapse;}
  .details td{padding:3px 0;}
  .details td:last-child{text-align:right;font-variant-numeric:tabular-nums;}
  .details img{max-width:100%;border-radius:4px;margin-bottom:8px;display:block;}
  .details .reason{color:var(--ink-soft);margin-top:4px;}
  .details .actions{margin-top:10px;display:flex;gap:8px;}

  button.link{background:none;border:none;color:var(--ink-soft);font-size:12px;cursor:pointer;text-decoration:underline;padding:0;}
  button.link.danger{color:var(--rust);}

  .add-btn{
    width:100%;padding:12px;background:none;border:1px dashed var(--line);
    border-radius:4px;color:var(--ink-soft);font-size:14px;cursor:pointer;margin-top:6px;
  }
  .add-btn:hover{border-color:var(--ink-soft);color:var(--ink);}

  form.editor{
    background:var(--card);border:1px solid var(--line);border-radius:4px;
    padding:16px;margin-top:10px;margin-bottom:10px;
  }
  form.editor label{display:block;font-size:12px;color:var(--ink-soft);margin:10px 0 4px;}
  form.editor label:first-child{margin-top:0;}
  form.editor input[type=text], form.editor input[type=number], form.editor textarea, form.editor select{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:4px;
    font-family:inherit;font-size:14px;background:#fff;color:var(--ink);
  }
  form.editor textarea{resize:vertical;min-height:50px;}
  .cost-item{display:flex;gap:8px;align-items:center;margin-bottom:6px;}
  .cost-item input[type=text]{flex:2;}
  .cost-item input[type=number]{flex:1;}
  .cost-item button{background:none;border:none;color:var(--rust);cursor:pointer;font-size:16px;padding:4px 8px;}
  .form-actions{display:flex;gap:10px;margin-top:16px;}
  .btn{
    padding:9px 18px;border-radius:4px;font-size:14px;cursor:pointer;font-family:inherit;
    border:1px solid var(--ink);
  }
  .btn-primary{background:var(--ink);color:#fff;}
  .btn-secondary{background:none;color:var(--ink-soft);border-color:var(--line);}
  .btn-danger{background:none;color:var(--rust);border-color:var(--rust);}
  .err{color:var(--rust);font-size:12px;margin-top:6px;}

  .type-toggle{display:flex;gap:8px;}
  .type-toggle button{
    flex:1;padding:8px;border-radius:4px;border:1px solid var(--line);background:#fff;
    color:var(--ink-soft);cursor:pointer;font-family:inherit;font-size:13px;
  }
  .type-toggle button.sel-moss{background:var(--moss-soft);border-color:var(--moss);color:var(--moss);font-weight:700;}
  .type-toggle button.sel-rust{background:var(--rust-soft);border-color:var(--rust);color:var(--rust);font-weight:700;}

  .scenario{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);}
  .scenario-title{font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:4px;}
  .badge{font-size:11px;background:var(--moss-soft);color:var(--moss);padding:2px 7px;border-radius:3px;margin-left:6px;vertical-align:middle;font-weight:500;}
  .empty{color:var(--ink-soft);font-size:14px;text-align:center;padding:24px 0;}
  .stat-bar{display:flex;gap:10px;margin-bottom:16px;}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:10px 12px;}
  .stat .label{font-size:12px;color:var(--ink-soft);}
  .stat .val{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;}

  .util-bar{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap;}
  .util-bar button.link{font-size:12px;}

  .controls-bar{display:flex;gap:8px;margin-bottom:12px;}
  .controls-bar select{
    flex:1;padding:7px 8px;border:1px solid var(--line);border-radius:4px;
    font-family:inherit;font-size:13px;background:#fff;color:var(--ink);
  }
  .controls-bar label.chk{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-soft);white-space:nowrap;}

  .status-badge{font-size:11px;padding:2px 7px;border-radius:3px;margin-left:6px;vertical-align:middle;font-weight:500;}
  .status-making{background:var(--line);color:var(--ink-soft);}
  .status-selling{background:var(--moss-soft);color:var(--moss);}
  .status-buyout{background:var(--rust-soft);color:var(--rust);}

  .deadline{font-size:12px;margin-top:4px;}
  .deadline.warn{color:var(--rust);font-weight:700;}

  .settings-panel, .import-confirm{
    background:var(--card);border:1px solid var(--line);border-radius:4px;
    padding:12px 14px;margin-top:10px;font-size:13px;
  }
  .settings-panel label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:4px;}
  .settings-panel input{padding:7px 10px;border:1px solid var(--line);border-radius:4px;font-size:14px;width:120px;}
  .settings-panel .form-actions{margin-top:10px;}

  .option-item{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
  .option-item input[type=text]{flex:2;}
  .option-item input[type=number]{flex:1;}
  .option-item button{background:none;border:none;color:var(--rust);cursor:pointer;font-size:16px;padding:4px 6px;}
  .option-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);}
  .option-row:last-child{border-bottom:none;}
  .option-row .opt-name{font-weight:700;font-size:14px;}
  .option-row .opt-detail{font-size:12px;color:var(--ink-soft);}
  .option-row .opt-total{text-align:right;font-variant-numeric:tabular-nums;}
  .option-row .opt-total .cash{font-size:12px;color:var(--ink-soft);}
  .option-row .opt-total .total{font-size:15px;font-weight:700;}
  .best-badge{font-size:11px;background:var(--moss-soft);color:var(--moss);padding:1px 6px;border-radius:3px;margin-left:6px;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>手作定價帳本</h1>
    <p>試算商品成本與售價，記錄推薦與避雷店家</p>
    <div class="util-bar">
      <button class="link" id="settingsBtn">預設值設定</button>
      <button class="link" id="exportBtn">匯出備份</button>
      <button class="link" id="importBtn">匯入備份</button>
      <input type="file" id="importFile" accept="application/json" style="display:none;">
    </div>
    <div id="settingsPanel"></div>
    <div id="importConfirm"></div>
  </header>

  <nav class="tabs">
    <button id="tabProductsBtn" class="active">成本試算</button>
    <button id="tabStoresBtn">店家清單</button>
    <button id="tabDecisionsBtn">時間成本比較</button>
  </nav>

  <section id="secProducts" class="active">
    <div class="stat-bar" id="productStats"></div>
    <div class="controls-bar" id="productControls"></div>
    <div id="productList"><div class="empty">載入中…</div></div>
    <button class="add-btn" id="addProductBtn">+ 新增產品點子</button>
  </section>

  <section id="secStores">
    <div id="storeList"><div class="empty">載入中…</div></div>
    <button class="add-btn" id="addStoreBtn">+ 新增店家</button>
  </section>

  <section id="secDecisions">
    <p style="font-size:13px;color:var(--ink-soft);margin-bottom:14px;">
      比較「自己做／花錢請人／買新的」哪個划算，把你的時間也換算進成本裡一起看。
    </p>
    <div id="decisionList"><div class="empty">載入中…</div></div>
    <button class="add-btn" id="addDecisionBtn">+ 新增比較情境</button>
  </section>
</div>

<script>
let products = [];
let stores = [];
let decisions = [];
let settings = { defaultConsignPercent: 0, defaultHourlyRate: 0 };
let sortMode = 'default';
let filterStatus = 'all';
let filterBuyoutOnly = false;

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const fmt = n => (Math.round(n * 10) / 10).toLocaleString('zh-Hant-TW');

function compressImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = ev=>{
      img.onload = ()=>{
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height * maxDim / width); width = maxDim; }
          else{ width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function loadData(){
  try{
    const p = await window.storage.get('products-list', false);
    products = p && p.value ? JSON.parse(p.value) : [];
  }catch(e){ products = []; }
  try{
    const s = await window.storage.get('stores-list', false);
    stores = s && s.value ? JSON.parse(s.value) : [];
  }catch(e){ stores = []; }
  try{
    const d = await window.storage.get('decisions-list', false);
    decisions = d && d.value ? JSON.parse(d.value) : [];
  }catch(e){ decisions = []; }
  try{
    const st = await window.storage.get('app-settings', false);
    if(st && st.value) settings = Object.assign(settings, JSON.parse(st.value));
  }catch(e){ /* keep defaults */ }
  renderProducts();
  renderStores();
  renderDecisions();
}

async function saveSettings(){
  try{ await window.storage.set('app-settings', JSON.stringify(settings), false); }
  catch(e){ console.error('save settings failed', e); }
}

async function saveProducts(){
  try{ await window.storage.set('products-list', JSON.stringify(products), false); }
  catch(e){ console.error('save products failed', e); }
}
async function saveStores(){
  try{ await window.storage.set('stores-list', JSON.stringify(stores), false); }
  catch(e){ console.error('save stores failed', e); }
}
async function saveDecisions(){
  try{ await window.storage.set('decisions-list', JSON.stringify(decisions), false); }
  catch(e){ console.error('save decisions failed', e); }
}

function calcProduct(p){
  const labor = (p.prodHours||0) * (p.hourlyRate||0); // 一次性：畫一張圖的時間成本
  const itemsTotal = (p.costItems||[]).reduce((s,i)=>s+(i.amount||0),0); // 一次性：整批雜費
  const oneTimeCost = labor + itemsTotal;
  const materialsPerUnit = p.materialsCost || 0; // 單件：每份印出來實際耗用的材料
  const qty = p.quantity || 1;
  const batchCost = materialsPerUnit * qty + oneTimeCost;
  const perItemCost = qty ? batchCost / qty : batchCost;
  const consignPercent = p.consignPercent || 0;
  const netPerItem = (p.price||0) * (1 - consignPercent/100);
  const totalNetRevenue = netPerItem * qty;
  const profitA = totalNetRevenue - batchCost;
  const marginA = totalNetRevenue ? (profitA / totalNetRevenue * 100) : 0;
  const buyoutPrice = p.buyoutPrice || 0;
  const profitB = buyoutPrice - batchCost;
  const marginB = buyoutPrice ? (profitB / buyoutPrice * 100) : 0;
  return {
    labor, itemsTotal, oneTimeCost, materialsPerUnit, perItemCost, qty, batchCost, consignPercent,
    netPerItem, totalNetRevenue, profitA, marginA, buyoutPrice, profitB, marginB,
    totalCost: perItemCost, profit: profitA, margin: marginA
  };
}

function getDeadlineInfo(p){
  if(!p.startDate || p.status !== '寄賣中') return null;
  const start = new Date(p.startDate + 'T00:00:00');
  if(isNaN(start.getTime())) return null;
  const days = p.periodType === '1個月' ? 30 : 14;
  const end = new Date(start.getTime() + days*24*3600*1000);
  const now = new Date();
  const diffDays = Math.ceil((end - now) / (24*3600*1000));
  return { diffDays, overdue: diffDays < 0 };
}

function initProductControls(){
  const box = document.getElementById('productControls');
  box.innerHTML = `
    <select id="sortSelect">
      <option value="default">排序：新增順序</option>
      <option value="marginDesc">排序：毛利率高到低</option>
      <option value="marginAsc">排序：毛利率低到高</option>
      <option value="name">排序：名稱</option>
    </select>
    <select id="filterStatusSelect">
      <option value="all">狀態：全部</option>
      <option value="製作中">狀態：製作中</option>
      <option value="寄賣中">狀態：寄賣中</option>
      <option value="已轉買斷">狀態：已轉買斷</option>
    </select>
    <label class="chk"><input type="checkbox" id="filterBuyoutChk"> 只看可買斷</label>
  `;
  document.getElementById('sortSelect').addEventListener('change', e=>{ sortMode = e.target.value; renderProducts(); });
  document.getElementById('filterStatusSelect').addEventListener('change', e=>{ filterStatus = e.target.value; renderProducts(); });
  document.getElementById('filterBuyoutChk').addEventListener('change', e=>{ filterBuyoutOnly = e.target.checked; renderProducts(); });
}

function getVisibleProducts(){
  let arr = products.slice();
  if(filterStatus !== 'all') arr = arr.filter(p => (p.status||'製作中') === filterStatus);
  if(filterBuyoutOnly) arr = arr.filter(p => p.buyoutPrice > 0);
  if(sortMode === 'marginDesc') arr.sort((a,b)=>calcProduct(b).margin - calcProduct(a).margin);
  else if(sortMode === 'marginAsc') arr.sort((a,b)=>calcProduct(a).margin - calcProduct(b).margin);
  else if(sortMode === 'name') arr.sort((a,b)=>a.name.localeCompare(b.name,'zh-Hant'));
  return arr;
}

function statusClass(status){
  if(status === '寄賣中') return 'status-selling';
  if(status === '已轉買斷') return 'status-buyout';
  return 'status-making';
}

function renderProducts(){
  const list = document.getElementById('productList');
  const statBar = document.getElementById('productStats');
  if(products.length === 0){
    list.innerHTML = '<div class="empty">還沒有產品點子，點下方新增一個吧</div>';
    statBar.innerHTML = '';
    return;
  }
  const avgMargin = products.reduce((s,p)=>s+calcProduct(p).margin,0)/products.length;
  const totalProfit = products.reduce((s,p)=>s+calcProduct(p).profitA,0);
  statBar.innerHTML = `
    <div class="stat"><div class="label">產品數</div><div class="val">${products.length}</div></div>
    <div class="stat"><div class="label">平均毛利率</div><div class="val">${fmt(avgMargin)}%</div></div>
    <div class="stat"><div class="label">預估整批毛利</div><div class="val">NT$${fmt(totalProfit)}</div></div>
  `;
  const visible = getVisibleProducts();
  if(visible.length === 0){
    list.innerHTML = '<div class="empty">沒有符合篩選條件的產品</div>';
    return;
  }
  list.innerHTML = visible.map(p=>{
    const c = calcProduct(p);
    const status = p.status || '製作中';
    const deadline = getDeadlineInfo(p);
    const marginClass = c.margin >= 30 ? 'good' : (c.margin < 0 ? 'bad' : '');
    const itemsRows = (p.costItems||[]).map(i=>`<tr><td>${escapeHtml(i.name)}</td><td>NT$${fmt(i.amount)}</td></tr>`).join('');
    return `
    <div class="row-item" data-id="${p.id}">
      <div class="row-head" onclick="toggleDetails('${p.id}')">
        <div>
          <div class="title">${escapeHtml(p.name)}<span class="status-badge ${statusClass(status)}">${status}</span>${p.buyoutPrice>0 ? '<span class="badge">可轉版權買斷</span>' : ''}</div>
          <div class="sub">均攤單件成本 NT$${fmt(c.perItemCost)} · 這批 ${fmt(c.qty)} 件 · 抽成 ${fmt(c.consignPercent)}%</div>
          ${deadline ? `<div class="deadline ${deadline.overdue?'warn':''}">${deadline.overdue ? `已超過期限 ${Math.abs(deadline.diffDays)} 天` : `距離期限還有 ${deadline.diffDays} 天`}</div>` : ''}
        </div>
        <div class="row-nums">
          <div class="price">NT$${fmt(p.price)}</div>
          <div class="margin ${marginClass}">整批毛利 NT$${fmt(c.profit)}（${fmt(c.margin)}%）</div>
        </div>
      </div>
      <div class="details" id="details-${p.id}">
        ${p.image ? `<img src="${p.image}" alt="${escapeHtml(p.name)}">` : ''}
        <div class="scenario" style="margin-top:0;border-top:none;padding-top:0;">
          <div class="scenario-title">整批一次性成本（畫一次圖 + 雜費，不隨數量倍增）</div>
          <table>
            <tr><td>製作(繪圖)時間 × 時薪</td><td>NT$${fmt(c.labor)}</td></tr>
            ${itemsRows}
            <tr><td><b>一次性成本小計</b></td><td><b>NT$${fmt(c.oneTimeCost)}</b></td></tr>
          </table>
        </div>
        <div class="scenario">
          <div class="scenario-title">單件材料成本（每份實際耗用的材料）</div>
          <table>
            <tr><td>材料成本（單件）</td><td>NT$${fmt(c.materialsPerUnit)}</td></tr>
            <tr><td>這批數量</td><td>${fmt(c.qty)}</td></tr>
          </table>
        </div>
        <div class="scenario">
          <div class="scenario-title">整批總成本 = 材料成本 × 數量 + 一次性成本</div>
          <table>
            <tr><td><b>整批總成本</b></td><td><b>NT$${fmt(c.batchCost)}</b></td></tr>
            <tr><td>售價（單件）</td><td>NT$${fmt(p.price)}</td></tr>
          </table>
        </div>
        <div class="scenario">
          <div class="scenario-title">情境A：寄賣抽成 ${fmt(c.consignPercent)}%（沒提早賣完）</div>
          <table>
            <tr><td>單件淨收入</td><td>NT$${fmt(c.netPerItem)}</td></tr>
            <tr><td>整批毛利</td><td>NT$${fmt(c.profitA)}</td></tr>
            <tr><td>毛利率</td><td>${fmt(c.marginA)}%</td></tr>
          </table>
        </div>
        ${c.buyoutPrice > 0 ? `
        <div class="scenario">
          <div class="scenario-title">情境B：${escapeHtml(p.periodType||'')}內提早賣完 → 轉版權買斷</div>
          <table>
            <tr><td>買斷金額</td><td>NT$${fmt(c.buyoutPrice)}</td></tr>
            <tr><td>整批毛利</td><td>NT$${fmt(c.profitB)}</td></tr>
            <tr><td>毛利率</td><td>${fmt(c.marginB)}%</td></tr>
          </table>
        </div>` : ''}
        <div class="actions">
          <button class="link" onclick="editProduct('${p.id}')">編輯</button>
          ${confirmDeleteProductId === p.id
            ? `<span style="color:var(--rust);font-size:12px;">確定刪除？</span>
               <button class="link danger" onclick="deleteProduct('${p.id}')">確認刪除</button>
               <button class="link" onclick="confirmDeleteProductId=null; renderProducts();">取消</button>`
            : `<button class="link danger" onclick="deleteProduct('${p.id}')">刪除</button>`
          }
        </div>
      </div>
    </div>`;
  }).join('');
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

function toggleDetails(id){
  const el = document.getElementById('details-'+id);

function showProductForm(data, isNew){
  const existing = document.getElementById('productFormWrap');
  if(existing) existing.remove();
  const wrap = document.createElement('form');
  wrap.className = 'editor';
  wrap.id = 'productFormWrap';
  wrap.innerHTML = `
    <label>產品名稱</label>
    <input type="text" id="f_name" value="${escapeHtml(data.name)}" placeholder="例如：手繪貼紙 A 款">
    <label>參考圖片</label>
    <input type="file" id="f_image" accept="image/*">
    <div id="f_image_preview"></div>
    <label>製作(繪圖)時間（小時，畫一次的時間，整批只算一次）</label>
    <input type="number" id="f_hours" value="${data.prodHours||0}" min="0" step="0.1">
    <label>時薪</label>
    <input type="number" id="f_rate" value="${data.hourlyRate||0}" min="0" step="1">
    <label>材料成本（單件，每份印出來實際耗用的材料，沒有就填0）</label>
    <input type="number" id="f_materials" value="${data.materialsCost||0}" min="0" step="1">
    <label>其他成本項目</label>
    <div id="f_costItems"></div>
    <button type="button" class="add-btn" id="f_addCostItem" style="margin-top:0;">+ 新增成本項目</button>
    <label>售價</label>
    <input type="number" id="f_price" value="${data.price||0}" min="0" step="1">
    <label>這批數量</label>
    <input type="number" id="f_qty" value="${data.quantity||1}" min="1" step="1">
    <label>寄賣抽成 %（朋友店裡抽成）</label>
    <input type="number" id="f_consign" value="${data.consignPercent||0}" min="0" max="100" step="1">
    <label>寄賣期限</label>
    <select id="f_period">
      <option value="2週" ${data.periodType==='2週'?'selected':''}>2 週</option>
      <option value="1個月" ${data.periodType==='1個月'?'selected':''}>1 個月</option>
    </select>
    <label>版權買斷價（提早賣完時，整批一次性金額，選填）</label>
    <input type="number" id="f_buyout" value="${data.buyoutPrice||0}" min="0" step="1">
    <label>狀態</label>
    <select id="f_status">
      <option value="製作中" ${(data.status||'製作中')==='製作中'?'selected':''}>製作中</option>
      <option value="寄賣中" ${data.status==='寄賣中'?'selected':''}>寄賣中</option>
      <option value="已轉買斷" ${data.status==='已轉買斷'?'selected':''}>已轉買斷</option>
    </select>
    <label>寄賣開始日期（選填，用來算期限倒數）</label>
    <input type="date" id="f_startDate" value="${data.startDate||''}">
    <div class="err" id="f_err" style="display:none;"></div>
    <div class="form-actions">
      <button type="button" class="btn btn-primary" id="f_save">${isNew?'新增':'儲存'}</button>
      <button type="button" class="btn btn-secondary" id="f_cancel">取消</button>
    </div>
  `;
  const list = document.getElementById('productList');
  list.parentNode.insertBefore(wrap, list);

  let currentImage = data.image;
  let costItems = data.costItems.slice();

  function renderCostItems(){
    const box = document.getElementById('f_costItems');
    box.innerHTML = costItems.map((it,idx)=>`
      <div class="cost-item">
        <input type="text" value="${escapeHtml(it.name)}" data-idx="${idx}" data-field="name">
        <input type="number" value="${it.amount}" data-idx="${idx}" data-field="amount" min="0" step="1">
        <button type="button" data-idx="${idx}" data-action="remove">×</button>
      </div>
    `).join('');
    box.querySelectorAll('input').forEach(inp=>{
      inp.addEventListener('input', e=>{
        const idx = +e.target.dataset.idx;
        const field = e.target.dataset.field;
        costItems[idx][field] = field==='amount' ? parseFloat(e.target.value)||0 : e.target.value;
      });
    });
    box.querySelectorAll('button[data-action=remove]').forEach(btn=>{
      btn.addEventListener('click', e=>{
        const idx = +e.target.dataset.idx;
        costItems.splice(idx,1);
        renderCostItems();
      });
    });
  }
  renderCostItems();

  document.getElementById('f_addCostItem').addEventListener('click', ()=>{
    costItems.push({id:uid(), name:'', amount:0});
    renderCostItems();
  });

  if(currentImage){
    document.getElementById('f_image_preview').innerHTML = `<img src="${currentImage}" style="max-width:100%;border-radius:4px;margin:8px 0;">`;
  }
  document.getElementById('f_image').addEventListener('change', async e=>{
    const file = e.target.files[0];
    if(!file) return;
    document.getElementById('f_image_preview').innerHTML = '<div class="empty" style="padding:8px 0;">圖片處理中…</div>';
    try{
      currentImage = await compressImage(file, 900, 0.72);
    }catch(err){
      currentImage = await new Promise(res=>{
        const reader = new FileReader();
        reader.onload = ev=>res(ev.target.result);
        reader.readAsDataURL(file);
      });
    }
    document.getElementById('f_image_preview').innerHTML = `<img src="${currentImage}" style="max-width:100%;border-radius:4px;margin:8px 0;">`;
  });

  document.getElementById('f_cancel').addEventListener('click', ()=>{
    wrap.remove();
  });

  document.getElementById('f_save').addEventListener('click', async ()=>{
    const name = document.getElementById('f_name').value.trim();
    const errEl = document.getElementById('f_err');
    if(!name){
      errEl.textContent = '請輸入產品名稱';
      errEl.style.display = 'block';
      return;
    }
    errEl.style.display = 'none';
    const newData = {
      id: data.id,
      name,
      image: currentImage,
      prodHours: parseFloat(document.getElementById('f_hours').value)||0,
      hourlyRate: parseFloat(document.getElementById('f_rate').value)||0,
      materialsCost: parseFloat(document.getElementById('f_materials').value)||0,
      costItems: costItems.filter(i=>i.name.trim()!==''),
      price: parseFloat(document.getElementById('f_price').value)||0,
      quantity: parseFloat(document.getElementById('f_qty').value)||1,
      consignPercent: parseFloat(document.getElementById('f_consign').value)||0,
      periodType: document.getElementById('f_period').value,
      buyoutPrice: parseFloat(document.getElementById('f_buyout').value)||0,
      status: document.getElementById('f_status').value,
      startDate: document.getElementById('f_startDate').value
    };
    if(isNew){
      products.push(newData);
    }else{
      const idx = products.findIndex(p=>p.id===newData.id);
      if(idx>=0) products[idx] = newData;
    }
    await saveProducts();
    wrap.remove();
    renderProducts();
  });
}

// ---- Stores ----
function renderStores(){
  const list = document.getElementById('storeList');
  if(stores.length === 0){
    list.innerHTML = '<div class="empty">還沒有店家紀錄，點下方新增一個吧</div>';
    return;
  }
  const recommend = stores.filter(s=>s.type==='推薦');
  const avoid = stores.filter(s=>s.type==='避雷');
  function section(title, arr, rustClass){
    if(arr.length===0) return '';
    return `<h3 style="font-size:15px;margin:18px 0 8px;">${title}</h3>` + arr.map(s=>`
      <div class="row-item ${rustClass?'rust':''}" data-id="${s.id}">
        <div class="row-head" onclick="toggleDetails('${s.id}')">
          <div>
            <div class="title">${escapeHtml(s.name)}</div>
            <div class="sub">${escapeHtml(s.category||'')}</div>
          </div>
        </div>
        <div class="details" id="details-${s.id}">
          <div class="reason">${escapeHtml(s.reason||'（未填寫原因）')}</div>
          ${s.link ? `<div style="margin-top:6px;"><a href="${escapeHtml(s.link)}" target="_blank" rel="noopener">${escapeHtml(s.link)}</a></div>` : ''}
          <div class="actions">
            <button class="link" onclick="editStore('${s.id}')">編輯</button>
            ${confirmDeleteStoreId === s.id
              ? `<span style="color:var(--rust);font-size:12px;">確定刪除？</span>
                 <button class="link danger" onclick="deleteStore('${s.id}')">確認刪除</button>
                 <button class="link" onclick="confirmDeleteStoreId=null; renderStores();">取消</button>`
              : `<button class="link danger" onclick="deleteStore('${s.id}')">刪除</button>`
            }
          </div>
        </div>
      </div>
    `).join('');
  }
  list.innerHTML = section('推薦店家', recommend, false) + section('避雷店家', avoid, true);
}

// ---- Time-cost decisions ----
function calcDecisionOptions(d){
  const rate = d.hourlyRate || 0;
  const opts = (d.options||[]).map(o=>{
    const timeCost = (o.hours||0) * rate;
    const total = (o.cash||0) + timeCost;
    return { ...o, timeCost, total };
  });
  let minTotalId = null, minCashId = null;
  if(opts.length){
    minTotalId = opts.reduce((a,b)=> b.total < a.total ? b : a).id;
    minCashId = opts.reduce((a,b)=> b.cash < a.cash ? b : a).id;
  }
  return { opts, minTotalId, minCashId };
}

function renderDecisions(){
  const list = document.getElementById('decisionList');
  if(decisions.length === 0){
    list.innerHTML = '<div class="empty">還沒有比較情境，點下方新增一個吧</div>';
    return;
  }
  list.innerHTML = decisions.map(d=>{
    const { opts, minTotalId, minCashId } = calcDecisionOptions(d);
    const rows = opts.map(o=>`
      <div class="option-row">
        <div>
          <div class="opt-name">${escapeHtml(o.name)}${o.id===minTotalId?'<span class="best-badge">總成本最低</span>':''}${o.id===minCashId && o.id!==minTotalId?'<span class="best-badge" style="background:var(--rust-soft);color:var(--rust);">現金最省</span>':''}</div>
          <div class="opt-detail">現金 NT$${fmt(o.cash)} + 時間 ${fmt(o.hours)}h × NT$${fmt(d.hourlyRate)}/h</div>
        </div>
        <div class="opt-total">
          <div class="cash">現金 NT$${fmt(o.cash)}</div>
          <div class="total">總成本 NT$${fmt(o.total)}</div>
        </div>
      </div>
    `).join('');
    return `
    <div class="row-item" data-id="${d.id}">
      <div class="row-head" onclick="toggleDetails('${d.id}')">
        <div>
          <div class="title">${escapeHtml(d.title)}</div>
          <div class="sub">時薪 NT$${fmt(d.hourlyRate)} · ${opts.length} 個方案</div>
        </div>
      </div>
      <div class="details" id="details-${d.id}">
        ${rows}
        <div class="actions">
          <button class="link" onclick="editDecision('${d.id}')">編輯</button>
          ${confirmDeleteDecisionId === d.id
            ? `<span style="color:var(--rust);font-size:12px;">確定刪除？</span>
               <button class="link danger" onclick="deleteDecision('${d.id}')">確認刪除</button>
               <button class="link" onclick="confirmDeleteDecisionId=null; renderDecisions();">取消</button>`
            : `<button class="link danger" onclick="deleteDecision('${d.id}')">刪除</button>`
          }
        </div>
      </div>
    </div>`;
  }).join('');
}

function showDecisionForm(data, isNew){
  const existing = document.getElementById('decisionFormWrap');
  if(existing) existing.remove();
  const wrap = document.createElement('form');
  wrap.className = 'editor';
  wrap.id = 'decisionFormWrap';
  wrap.innerHTML = `
    <label>情境名稱</label>
    <input type="text" id="d_title" value="${escapeHtml(data.title)}" placeholder="例如：晚餐吃什麼 / 洗衣機壞了">
    <label>時薪（你的時間換算成本）</label>
    <input type="number" id="d_rate" value="${data.hourlyRate||0}" min="0" step="1">
    <label>方案比較</label>
    <div id="d_options"></div>
    <button type="button" class="add-btn" id="d_addOption" style="margin-top:0;">+ 新增方案</button>
    <div class="err" id="d_err" style="display:none;"></div>
    <div class="form-actions">
      <button type="button" class="btn btn-primary" id="d_save">${isNew?'新增':'儲存'}</button>
      <button type="button" class="btn btn-secondary" id="d_cancel">取消</button>
    </div>
  `;
  const list = document.getElementById('decisionList');
  list.parentNode.insertBefore(wrap, list);

  let options = data.options.slice();
  function renderOptions(){
    const box = document.getElementById('d_options');
    box.innerHTML = options.map((o,idx)=>`
      <div class="option-item">
        <input type="text" value="${escapeHtml(o.name)}" data-idx="${idx}" data-field="name" placeholder="方案名稱">
        <input type="number" value="${o.cash}" data-idx="${idx}" data-field="cash" min="0" step="1" placeholder="現金">
        <input type="number" value="${o.hours}" data-idx="${idx}" data-field="hours" min="0" step="0.1" placeholder="時數">
        <button type="button" data-idx="${idx}" data-action="remove">×</button>
      </div>
    `).join('');
    box.querySelectorAll('input').forEach(inp=>{
      inp.addEventListener('input', e=>{
        const idx = +e.target.dataset.idx;
        const field = e.target.dataset.field;
        options[idx][field] = field==='name' ? e.target.value : (parseFloat(e.target.value)||0);
      });
    });
    box.querySelectorAll('button[data-action=remove]').forEach(btn=>{
      btn.addEventListener('click', e=>{
        const idx = +e.target.dataset.idx;
        options.splice(idx,1);
        renderOptions();
      });
    });
  }
  renderOptions();

  document.getElementById('d_addOption').addEventListener('click', ()=>{
    options.push({id:uid(), name:'', cash:0, hours:0});
    renderOptions();
  });

  document.getElementById('d_cancel').addEventListener('click', ()=> wrap.remove());

  document.getElementById('d_save').addEventListener('click', async ()=>{
    const title = document.getElementById('d_title').value.trim();
    const errEl = document.getElementById('d_err');
    const validOptions = options.filter(o=>o.name.trim()!=='');
    if(!title){
      errEl.textContent = '請輸入情境名稱';
      errEl.style.display = 'block';
      return;
    }
    if(validOptions.length < 2){
      errEl.textContent = '至少需要 2 個方案才能比較';
      errEl.style.display = 'block';
      return;
    }
    errEl.style.display = 'none';
    const newData = {
      id: data.id,
      title,
      hourlyRate: parseFloat(document.getElementById('d_rate').value)||0,
      options: validOptions
    };
    if(isNew){
      decisions.push(newData);
    }else{
      const idx = decisions.findIndex(d=>d.id===newData.id);
      if(idx>=0) decisions[idx] = newData;
    }
    await saveDecisions();
    wrap.remove();
    renderDecisions();
  });
}

// ---- Export / Import ----
document.getElementById('exportBtn').addEventListener('click', ()=>{
  const payload = JSON.stringify({ products, stores, decisions, settings, exportedAt: new Date().toISOString() }, null, 2);
  const blob = new Blob([payload], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'pricing-backup-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});

});

function mergeById(existing, incoming){
  const map = new Map(existing.map(item=>[item.id, item]));
  incoming.forEach(item=>map.set(item.id, item));
  return Array.from(map.values());
}

let pendingImport = null;
document.getElementById('importFile').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    try{
      const parsed = JSON.parse(ev.target.result);
      if(!Array.isArray(parsed.products) || !Array.isArray(parsed.stores)){
        throw new Error('格式不正確');
      }
      if(!Array.isArray(parsed.decisions)) parsed.decisions = [];
      pendingImport = parsed;
      const box = document.getElementById('importConfirm');
      box.innerHTML = `
        <div class="import-confirm">
          即將匯入 ${parsed.products.length} 個產品、${parsed.stores.length} 個店家紀錄、${parsed.decisions.length} 個比較情境。
          <div style="margin-top:8px;">
            <label class="chk" style="margin-bottom:4px;"><input type="radio" name="importMode" value="merge" checked> 合併（保留現有資料，同 ID 的用匯入的覆蓋，其餘不動）</label><br>
            <label class="chk"><input type="radio" name="importMode" value="overwrite"> 完全覆蓋（清空現有資料，只留匯入的）</label>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-danger" id="confirmImportBtn">確認匯入</button>
            <button type="button" class="btn btn-secondary" id="cancelImportBtn">取消</button>
          </div>
        </div>
      `;
      document.getElementById('confirmImportBtn').addEventListener('click', async ()=>{
        const mode = document.querySelector('input[name="importMode"]:checked').value;
        if(mode === 'overwrite'){
          products = pendingImport.products;
          stores = pendingImport.stores;
          decisions = pendingImport.decisions;
        }else{
          products = mergeById(products, pendingImport.products);
          stores = mergeById(stores, pendingImport.stores);
          decisions = mergeById(decisions, pendingImport.decisions);
        }
        if(pendingImport.settings) settings = Object.assign(settings, pendingImport.settings);
        await saveProducts();
        await saveStores();
        await saveDecisions();
        await saveSettings();
        box.innerHTML = '';
        renderProducts();
        renderStores();
        renderDecisions();
      });
      document.getElementById('cancelImportBtn').addEventListener('click', ()=>{
        box.innerHTML = '';
        pendingImport = null;
      });
    }catch(err){
      document.getElementById('importConfirm').innerHTML = '<div class="import-confirm" style="color:var(--rust);">檔案格式不正確，無法匯入</div>';
    }
    document.getElementById('importFile').value = '';
  };
  reader.readAsText(file);
});

// ---- Tabs ----
const tabs = [
  { btn:'tabProductsBtn', sec:'secProducts' },
  { btn:'tabStoresBtn', sec:'secStores' },
  { btn:'tabDecisionsBtn', sec:'secDecisions' }
];
function switchTab(activeBtnId){
  tabs.forEach(t=>{
    const isActive = t.btn === activeBtnId;
    document.getElementById(t.btn).classList.toggle('active', isActive);
    document.getElementById(t.sec).classList.toggle('active', isActive);
  });
}
tabs.forEach(t=>{
  document.getElementById(t.btn).addEventListener('click', ()=> switchTab(t.btn));
});
document.getElementById('addProductBtn').addEventListener('click', addProductForm);
document.getElementById('addStoreBtn').addEventListener('click', addStoreForm);
document.getElementById('addDecisionBtn').addEventListener('click', addDecisionForm);

initProductControls();
loadData();
</script>
</body>
